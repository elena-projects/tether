    <meta charset="UTF-8" />

    <title>Tether</title>
    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y6MPKG013G"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Y6MPKG013G');
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // 暖中性主题：把 white 映射成随日夜翻转的墨色变量（一次覆盖全站白色文字/玻璃面），
      // 把旧的 teal/emerald/sky/cyan 强调色统一成固定的陶土音阶（陶土全时段作 Tether 识别色）。
      const rose = {50:'#faf1ec',100:'#f3ddd0',200:'#e9c3ae',300:'#db9f80',400:'#cd7a56',500:'#c06a45',600:'#a5573a',700:'#854531',800:'#6a3a2c',900:'#4e2c22'};
      // warm taupe grey so cool "slate/gray" text harmonizes with the rose palette
      const warmGrey = {50:'#f7f3f1',100:'#efe8e4',200:'#e0d5cf',300:'#cbbcb4',400:'#a99b92',500:'#8c7e76',600:'#6f635c',700:'#574d47',800:'#3f3833',900:'#2b2521',950:'#1c1815'};
      tailwind.config = {
        theme: { extend: { colors: {
          white: 'rgb(var(--tint) / <alpha-value>)',
          teal: rose, emerald: rose, cyan: rose, sky: rose,
          yellow: rose, amber: rose,           // 火花/智慧点缀也归入藕粉
          slate: warmGrey, gray: warmGrey,     // 冷灰 → 暖灰
        } } }
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');
      
      /* Global Reset for Responsiveness */
      * {
        box-sizing: border-box;
        max-width: 100%;
      }

      body {
        font-family: 'Courier Prime', 'Courier New', monospace;
        background-color: #453c33;
        color: #ede4da;
        overflow-x: hidden; /* Prevent horizontal scroll */
        transition: background-color 1s ease, color 1s ease;
      }

      /* Custom scrollbar hide */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Typewriter cursor animation */
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        50% { opacity: 0; }
      }
      
      .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      @keyframes floatUp {
        0% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-20px); }
      }
      .animate-float-up {
        animation: floatUp 1s ease-out forwards;
      }

      /* THE FORCE REVEAL CSS */
      .visible {
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
      }
      
      /* Ensure AI Message Box is hidden by default if not visible class */
      #ai-message-box {
        transition: opacity 1s ease-in;
      }
    </style>

}
</script>
