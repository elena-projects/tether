server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression — Cloud Run does not add this for us, and the JS bundle is the
    # bulk of the page weight. gzip typically cuts it to roughly a quarter.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json font/ttf font/otf;

    # Security headers (inherited by locations that set no add_header of their own).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://elenaprojects.cc https://www.google-analytics.com; connect-src 'self' https://elenaprojects.cc https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

    # index.html must never be cached, so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://elenaprojects.cc https://www.google-analytics.com; connect-src 'self' https://elenaprojects.cc https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
        expires -1;
    }

    # Retired client and database routes stay explicitly closed instead of falling
    # through to index.html, which would misleadingly return a successful response.
    location ^~ /talks/ { return 403; }
    location = /v1beta { return 404; }
    location ^~ /v1beta/ { return 404; }
    location = /rtdb { return 403; }
    location ^~ /rtdb/ { return 403; }

    # The retired Talks page must be a real redirect, not an SPA fallback with a 200.
    location = /talks.html { return 302 https://$host/; }
    location = /talks { return 302 https://$host/; }

    # Fixed-action AI support lives in the Portfolio API. The browser can only reach it
    # through this same-origin route; nginx adds the shared proxy secret and a per-caller
    # rate limit before forwarding it.
    location = /api/companion {
        client_max_body_size 8k;
        limit_req zone=companion burst=6 nodelay;
        limit_req_status 429;

        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $portfolio_api "elenaprojects.cc";
        proxy_pass https://$portfolio_api/api/companion;
        proxy_ssl_server_name on;
        proxy_ssl_name $portfolio_api;
        proxy_set_header Host $portfolio_api;
        proxy_set_header x-tether-proxy "${WALL_PROXY_SECRET}";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    location ~ ^/api/(wall|spaces)$ {
        client_max_body_size 8k;
        limit_req zone=wall burst=10 nodelay;
        limit_req_status 429;

        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $portfolio_api "elenaprojects.cc";
        proxy_pass https://$portfolio_api$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name $portfolio_api;
        proxy_set_header Host $portfolio_api;
        proxy_set_header x-tether-proxy "${WALL_PROXY_SECRET}";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    # Mood presence writes use a server-signed anonymous session. This prevents one
    # browser from overwriting another person's public UID while keeping sign-up absent.
    location = /api/state {
        limit_req zone=state burst=10 nodelay;
        limit_req_status 429;

        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $portfolio_api "elenaprojects.cc";
        proxy_pass https://$portfolio_api/api/state;
        proxy_ssl_server_name on;
        proxy_ssl_name $portfolio_api;
        proxy_set_header Host $portfolio_api;
        proxy_set_header x-tether-proxy "${WALL_PROXY_SECRET}";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
