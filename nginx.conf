server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression — Cloud Run does not add this for us, and the JS bundle is the
    # bulk of the page weight. gzip typically cuts it to roughly a quarter.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml application/manifest+json font/ttf font/otf;

    # Security headers (inherited by locations that set no add_header of their own).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # index.html must never be cached, so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        expires -1;
    }

    # Mood presence is private. Matching now happens inside /api/state and returns at most
    # one anonymous candidate, so browsers must never receive the full users collection.
    # Keep this above the generic /rtdb/ rule because nginx takes the first regex match.
    location ~ ^/rtdb/users(\.json|/.*)$ {
        return 403;
    }

    location ~ ^/rtdb/(.*)$ {
        # Anti-abuse: only accept requests referred from our own app (matches /v1beta).
        valid_referers tether.elenaprojects.cc;
        if ($invalid_referer) { return 403; }
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $rtdb "tether-7fc38-default-rtdb.asia-southeast1.firebasedatabase.app";
        proxy_pass https://$rtdb/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name $rtdb;
        proxy_set_header Host $rtdb;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    # Private one-to-one messages live under a secret path segment that only the server
    # knows, so — unlike the public wall — they can't be listed or scraped by anyone who
    # simply knows the database URL. Same trick as the feedback inbox. The browser only
    # ever sees "/talks/...", so this stays same-origin and reachable from mainland China.
    location ~ ^/talks/(.*)$ {
        # PAUSED 2026-10-04. Every client was downloading the whole box, so every visitor
        # received every private message; see TALKS_ENABLED in services/talks.ts. Refusing
        # here as well stops a tab still running the old code. Remove this line only once
        # reads are restricted to a talk's two participants.
        return 403;

        valid_referers tether.elenaprojects.cc;
        if ($invalid_referer) { return 403; }
        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $rtdb_t "tether-7fc38-default-rtdb.asia-southeast1.firebasedatabase.app";
        proxy_pass https://$rtdb_t/talks/${TALKS_SECRET}/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name $rtdb_t;
        proxy_set_header Host $rtdb_t;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    # The retired Talks page must be a real redirect, not an SPA fallback with a 200.
    location = /talks.html { return 302 https://$host/; }
    location = /talks { return 302 https://$host/; }

    # Moderated wall writes live in the portfolio API. The browser can only reach that
    # function through this same-origin route; nginx adds the shared proxy secret and a
    # per-caller rate limit before forwarding it.
    location ~ ^/api/(wall|spaces)$ {
        limit_req zone=wall burst=10 nodelay;
        limit_req_status 429;

        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $portfolio_api "elenaprojects.cc";
        proxy_pass https://$portfolio_api$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name $portfolio_api;
        proxy_set_header Host $portfolio_api;
        proxy_set_header x-tether-proxy "${WALL_PROXY_SECRET}";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    # Mood presence writes use a server-signed anonymous session. This prevents one
    # browser from overwriting another person's public UID while keeping sign-up absent.
    location = /api/state {
        limit_req zone=state burst=10 nodelay;
        limit_req_status 429;

        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $portfolio_api "elenaprojects.cc";
        proxy_pass https://$portfolio_api/api/state;
        proxy_ssl_server_name on;
        proxy_ssl_name $portfolio_api;
        proxy_set_header Host $portfolio_api;
        proxy_set_header x-tether-proxy "${WALL_PROXY_SECRET}";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    # Same-origin proxy → Gemini (content moderation / companion messages).
    # The API key is INJECTED here, server-side, from the GEMINI_API_KEY env var
    # (substituted at container start). The browser never sees or sends the real key.
    location /v1beta/ {
        # Anti-abuse: only serve requests referred from our own app, so nobody can use
        # this domain as an open relay to burn the injected Gemini key's quota.
        valid_referers tether.elenaprojects.cc;
        if ($invalid_referer) { return 403; }
        # See conf.d/00-ratelimit.conf for the reasoning and the numbers. nodelay lets a
        # normal burst through at full speed and only slows a caller that keeps going.
        limit_req zone=gemini burst=40 nodelay;
        limit_req_status 429;

        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $gem "generativelanguage.googleapis.com";
        proxy_pass https://$gem$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name $gem;
        proxy_set_header Host $gem;
        proxy_set_header x-goog-api-key "${GEMINI_API_KEY}";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
